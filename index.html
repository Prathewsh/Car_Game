<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Store</title>
    <style>
        * {
            box-sizing: border-box;
        }
        :root {
            --bg-color: #1b2838;
            --featured-bg: #0f161f;
            --text-main: #ffffff;
            --text-muted: #acb2b8;
            --btn-bg: #4c6b22;
            --btn-hover: #8ed629;
            --steam-blue: #66c0f4;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            padding: 20px;
            margin-top: 30px;
        }

        /* Featured Section Carousel */
        .carousel-wrapper {
            position: relative;
            height: 380px;
            margin-bottom: 15px;
        }

        .featured-container {
            display: flex;
            height: 100%;
            background-color: var(--featured-bg);
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
            position: absolute;
            top: 0; left: 0; right: 0;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease;
        }

        .featured-container.active {
            opacity: 1;
            visibility: visible;
        }
        
        .featured-container:hover .main-image {
            opacity: 0.9;
        }

        .main-image {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 0.2s;
        }
        
        /* If no image exists, fallback gradient */
        .main-image.fallback {
            background: linear-gradient(135deg, #111, #333);
        }

        .featured-info {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            background: linear-gradient(to right, rgba(15,22,31,1) 0%, rgba(22,32,45,1) 100%);
        }

        .featured-title {
            font-size: 24px;
            margin: 0 0 15px 0;
            font-weight: normal;
        }

        .screenshot-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 5px;
            margin-bottom: 20px;
            height: 150px;
        }

        .screenshot {
            background-color: #2a3f5a;
            background-size: cover;
            background-position: center;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        
        .screenshot:hover {
            opacity: 1;
        }
        
        /* Simulate screenshots from the main image */
        .screenshot:nth-child(1) { background-image: url('moto_legends.png'); background-position: top left; }
        .screenshot:nth-child(2) { background-image: url('moto_legends.png'); background-position: top right; }
        .screenshot:nth-child(3) { background-image: url('moto_legends.png'); background-position: bottom left; }
        .screenshot:nth-child(4) { background-image: url('moto_legends.png'); background-position: bottom right; }

        .featured-status {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .tag {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 2px 5px;
            border-radius: 2px;
            font-size: 11px;
            color: var(--text-muted);
            display: inline-block;
            margin-bottom: 15px;
        }

        .featured-bottom {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 15px;
            color: #c6d4df;
        }

        /* Carousel Dots */
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 40px;
        }

        .dot {
            width: 15px;
            height: 9px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .dot:hover { background-color: rgba(255, 255, 255, 0.4); }
        .dot.active { background-color: rgba(255, 255, 255, 0.8); }

        /* Special Offers Section */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-main);
            margin: 0;
            font-weight: normal;
        }

        .browse-btn {
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: transparent;
            color: white;
            padding: 3px 10px;
            font-size: 11px;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .browse-btn:hover {
            border-color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .offers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        .offer-card {
            background-color: var(--featured-bg);
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }
        
        .offer-card:hover {
            transform: scale(1.02);
        }

        .offer-img {
            height: 150px;
            background-size: cover;
            background-position: center;
        }

        .offer-info {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            background: rgba(0,0,0,0.2);
        }

        .offer-title {
            font-size: 14px;
            margin: 0 0 5px 0;
            color: var(--text-main);
        }

        .discount-block {
            display: flex;
            align-items: center;
            background: #4c6b22;
            padding: 2px;
            border-radius: 2px;
        }
        
        .discount-pct {
            color: #a4d007;
            font-size: 13px;
            font-weight: bold;
            padding: 0 4px;
        }
        
        .prices {
            background: #000;
            padding: 2px 6px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        
        .price-old {
            color: #738895;
            font-size: 10px;
            text-decoration: line-through;
        }
        
        .price-new {
            color: #acdbf5;
            font-size: 12px;
        }

        /* Global Header (Navbar) */
        .global-header {
            width: 100%;
            background-color: #171a21;
            display: flex;
            justify-content: center;
            height: 104px;
        }
        .header-content {
            width: 1400px;
            display: flex;
            align-items: flex-start;
            padding-top: 30px;
            position: relative;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #dfdfdf;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .logo-icon {
            width: 32px;
            height: 32px;
            background: #dfdfdf;
            border-radius: 50%;
            display: inline-block;
        }
        .nav-menu {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .nav-item {
            color: #b8b6b4;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 14px;
            font-weight: 600;
        }
        .nav-item:hover, .nav-item.active {
            color: #ffffff;
        }
        
        /* Secondary Navbar */
        .store-nav {
            width: 100%;
            max-width: 1400px;
            background: rgba(0, 0, 0, 0.2);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.4);
        }
        .store-nav-menu {
            display: flex;
        }
        .store-nav-item {
            color: #d1d8df;
            text-decoration: none;
            font-size: 13px;
            padding: 10px 15px;
            text-shadow: 0px 2px 3px rgba(0,0,0,0.3);
        }
        .store-nav-item:hover {
            background: #316282;
            color: #ffffff;
        }
        .search-container {
            padding-right: 5px;
            display: flex;
        }
        .search-box {
            background-color: #316282;
            border: 1px solid rgba(0,0,0,0.3);
            color: #fff;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 13px;
            width: 200px;
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
            outline: none;
        }
        .search-btn {
            background: #66c0f4;
            border: none;
            padding: 4px 10px;
            border-radius: 3px;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            cursor: pointer;
        }
        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .header-content {
                width: 100%;
                flex-direction: column;
                align-items: center;
                padding-top: 15px;
            }
            .logo {
                margin-right: 0;
                margin-bottom: 10px;
            }
            .global-header {
                height: auto;
                padding-bottom: 15px;
            }
            .nav-menu {
                flex-wrap: wrap;
                justify-content: center;
            }
            .store-nav {
                flex-direction: column;
                align-items: stretch;
            }
            .store-nav-menu {
                flex-wrap: wrap;
                justify-content: center;
                padding: 10px;
            }
            .search-container {
                justify-content: center;
                padding: 10px;
            }
            .search-box {
                flex: 1;
            }
            .carousel-wrapper {
                height: 250px;
            }
            .offers-grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 20px;
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Global Header -->
    <div class="global-header">
        <div class="header-content">
            <a href="#" class="logo">
                Gamehub
            </a>
            <div class="nav-menu">
                <a href="#" class="nav-item active">STORE</a>
                <a href="#" class="nav-item">COMMUNITY</a>
                <a href="#" class="nav-item">ABOUT</a>
                <a href="#" class="nav-item">SUPPORT</a>
            </div>
        </div>
    </div>



    <div class="container">
        
        <!-- Featured Main Carousel Items -->
        <div class="carousel-wrapper">
            <!-- Slide 1 -->
            <a href="motolegends.html" class="featured-container active">
                <div class="main-image" style="background-image: url('moto_legends.png');"></div>
            </a>
            <!-- Slide 2 -->
            <a href="motorush.html" class="featured-container">
                <div class="main-image" style="background: linear-gradient(135deg, #4776E6, #8E54E9);"></div>
            </a>
            <!-- Slide 3 -->
            <a href="motorush2d.html" class="featured-container">
                <div class="main-image" style="background-image: url('moto_rush2d.png');"></div>
            </a>
        </div>

        <!-- Carousel Dots -->
        <div class="carousel-dots">
            <div class="dot active" onclick="setSlide(0)"></div>
            <div class="dot" onclick="setSlide(1)"></div>
            <div class="dot" onclick="setSlide(2)"></div>
        </div>

        <!-- Special Offers -->
        <div class="section-header">
            <h2 class="section-title">All Games</h2>
            <a href="#" class="browse-btn">BROWSE ALL</a>
        </div>

        <div class="offers-grid">
            <!-- Offer 1 (Moto Rush 2D) -->
            <a href="motorush2d.html" class="offer-card">
                <div class="offer-img" style="background-image: url('moto_rush2d.png');"></div>
                <div class="offer-info">
                    <div>
                        <h3 class="offer-title">Moto Rush 2D</h3>
                    </div>
                </div>
            </a>

            <!-- Offer 2 (Moto Rush) -->
            <a href="motorush.html" class="offer-card">
                <div class="offer-img" style="background: linear-gradient(135deg, #4776E6, #8E54E9);"></div>
                <div class="offer-info">
                    <div>
                        <h3 class="offer-title">Moto Rush</h3>
                    </div>
                </div>
            </a>
            
             <!-- Filler Offer 3 -->
            <a href="#" class="offer-card">
                <div class="offer-img" style="background: linear-gradient(135deg, #111, #333);"></div>
                <div class="offer-info">
                    <div>
                        <h3 class="offer-title">Coming Soon</h3>
                    </div>
                </div>
            </a>
        </div>

    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.featured-container');
        const dots = document.querySelectorAll('.dot');
        let slideInterval;

        function showSlide(index) {
            slides.forEach((slide, i) => {
                slide.classList.remove('active');
                dots[i].classList.remove('active');
            });
            slides[index].classList.add('active');
            dots[index].classList.add('active');
            currentSlide = index;
        }

        function setSlide(index) {
            showSlide(index);
            resetInterval();
        }

        function nextSlide() {
            let next = (currentSlide + 1) % slides.length;
            showSlide(next);
        }

        function resetInterval() {
            clearInterval(slideInterval);
            slideInterval = setInterval(nextSlide, 5000);
        }

        resetInterval();
    </script>
</body>
</html>
